<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Bad request · Gifting Lists</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&display=swap">
    <style>
      :root { --paper: #fbf6f0; --card: #ffffff; --line: #e7ddd2; --ink: #2b2622; --muted: #6b6159; --clay: #b5482a; --accent: #b5482a; --accent-hover: #9c3d23; }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #1b1714; --card: #2a2420; --line: #463c35; --ink: #f3ece4; --muted: #b8ab9f; --clay: #f08a66; --accent: #c4552f; --accent-hover: #d3643d; }
      }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100dvh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 1.125rem/1.5 "Figtree", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      header { border-bottom: 1px solid var(--line); background: var(--card); }
      .page { width: 100%; max-width: 64rem; margin: 0 auto; padding: 0 1rem; }
      @media (min-width: 40rem) { .page { padding: 0 1.5rem; } }
      .bar { height: 4rem; display: flex; align-items: center; }
      .wordmark { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--ink); text-decoration: none; font: 600 1.5rem "Fraunces", ui-serif, Georgia, serif; letter-spacing: -0.025em; font-variation-settings: "SOFT" 100; }
      .wordmark img { width: 2rem; height: 2rem; }
      .wordmark .tail { color: var(--clay); }
      main { flex: 1; padding-top: 3rem; padding-bottom: 4rem; }
      h1 { font: 600 2.25rem/1.15 "Fraunces", ui-serif, Georgia, serif; font-variation-settings: "SOFT" 60; text-wrap: pretty; }
      p { margin-top: 0.75rem; max-width: 36rem; color: var(--muted); text-wrap: pretty; }
      .button { display: inline-flex; align-items: center; height: 2.75rem; margin-top: 2rem; padding: 0 1.25rem; border-radius: 9999px; background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; text-decoration: none; }
      .button:hover { background: var(--accent-hover); }
    </style>
  </head>
  <body>
    <header>
      <div class="page bar">
        <a class="wordmark" href="/"><img src="/icon.svg" alt=""><span>gifting<span class="tail">lists</span></span></a>
      </div>
    </header>
    <main><div class="page">
      <h1>That didn't work</h1>
      <p>Something about that request wasn't right. Go back and try again.</p>
      <a class="button" href="/">Go to your groups</a>
    </div></main>
  </body>
</html>
