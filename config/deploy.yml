service: gifting
image: gifting

servers:
  web:
    - <%= ENV.fetch("DEPLOY_HOST") %>

proxy:
  ssl: true
  hosts:
    - giftinglists.com
    - www.giftinglists.com
  forward_headers: true

registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - RESTIC_PASSWORD
    - STORAGE_BOX
    - STORAGE_BOX_SSH_KEY_BASE64
  clear:
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: gifting-db

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  backup: app exec --reuse "bin/rails runner 'Backup.new.run'"
  restic: app exec --interactive --reuse "bin/restic"

volumes:
  - "/mnt/volume/giftinglists/storage:/rails/storage"
  - "/mnt/volume/giftinglists/backups:/rails/backups"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgres:18
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    env:
      clear:
        POSTGRES_USER: gifting
        POSTGRES_DB: gifting_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /mnt/volume/giftinglists/database:/var/lib/postgresql
