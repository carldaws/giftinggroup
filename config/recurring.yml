production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  schedule_birthdays:
    command: "Occasion.schedule_all"
    schedule: every day at 12:05am
  backup:
    class: BackupJob
    schedule: every day at 3am Europe/London
  purge_abandoned_files:
    command: "ActiveStorage::Blob.unattached.where(created_at: ..LinkPreview::PHOTO_LIFETIME.ago).find_each(&:purge_later)"
    schedule: every hour at minute 40
